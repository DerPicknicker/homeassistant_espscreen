# LilyGO T-Encoder Pro, DXQ120MYB2416A display revision only.
# Tested only on SH8601 AMOLED / CHSC5816 capacitive touch hardware.
# Pins follow LilyGO's official example. The CO5300 / CST816 revision is untested
# and requires a separate hardware profile; do not use this profile for it.
packages:
  build: !include esp-idf.yaml
  rotary: !include ../features/rotary-input.yaml

substitutions:
  ROTARY_PIN_A: GPIO1
  ROTARY_PIN_B: GPIO2
  ROTARY_PIN_BUTTON: GPIO0

esphome:
  platformio_options:
    build_flags:
      # Keep the large shared core's Xtensa literals beside their functions.
      - -Wa,--text-section-literals

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  cpu_frequency: 240MHz

psram:
  mode: octal
  speed: 80MHz

spi:
  id: lcd
  type: quad
  clk_pin: GPIO12
  data_pins: [GPIO11, GPIO13, GPIO7, GPIO14]

i2c:
  id: touch_bus
  sda: GPIO5
  scl: GPIO6
  frequency: 100kHz

display:
  - platform: qspi_dbi
    id: my_display
    spi_id: lcd
    model: CUSTOM
    dimensions: 390x390
    cs_pin: GPIO10
    reset_pin: GPIO4
    enable_pin: GPIO3
    data_rate: 40MHz
    brightness: 80
    draw_from_origin: true
    auto_clear_enabled: false
    update_interval: never
    # qspi_dbi performs reset and sleep-out before this sequence.
    init_sequence:
      - [0x13]
      - [0x20]
      - [0x3A, 0x05]
      - [0x29]
      - [0x53, 0x28]
      - [0x58, 0x00]

touchscreen:
  - platform: chsc5816
    id: ts_touch
    i2c_id: touch_bus
    display: my_display
    reset_pin: GPIO8
    interrupt_pin: GPIO9

# AMOLED brightness is a controller command, not PWM on its power-enable pin.
# This adapter preserves the shared backlight light, transitions and standby path.
output:
  - platform: template
    id: gpio_backlight_pwm
    type: float
    write_action:
      - lambda: 'id(my_display).set_brightness(static_cast<uint8_t>(state * 255.0f));'
